{% extends "mainapp/base.html" %}
{% load static %}

{% block content %}

<br>

<div class="container">
    <div class="text-center mb-4">
        <h2>Chào mừng đến với Mixi support, mình có thể giúp gì cho bạn?</h2>
        <p class="text-muted">Tải ảnh sản phẩm để mình có thể hỗ trợ!</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">

            <!-- CHAT BOX -->
            <div class="card shadow-sm mb-3">
                <div class="card-body" id="chat-box" style="height: 400px; overflow-y: auto; background: #f7f7f7;">
                    <!-- Tin nhắn sẽ được append từ JS -->
                </div>
            </div>

            <!-- FORM UPLOAD -->
            <form id="chat-form" style="position: relative;"> <!-- relative để ảnh preview absolute tham chiếu -->
                <div class="input-group mb-3">
                    <input type="file"
                           id="imageInput"
                           class="form-control"
                           accept="image/*">
                    <button type="button" class="btn btn-success" onclick="sendMessage()">Gửi</button>

                    <!-- Preview ảnh, mặc định ẩn, position absolute -->
                    <img id="preview" src="#"
                         style="display: none;
                    position: absolute;
                    top: -10px;
                    left: -60px;
                    width: 50px;
                    height: 50px;
                    object-fit: cover;
                    border-radius: 5px;
                    box-shadow: 0 0 5px rgba(0,0,0,0.3);">
                </div>
            </form>

        </div>
    </div>
</div>

<!-- JS -->
<script>
    const preview = document.getElementById("preview");
    const imageInput = document.getElementById("imageInput");
    const chatBox = document.getElementById("chat-box");

    // Hiển thị ảnh preview nếu có file
    imageInput.addEventListener("change", function(event){
        const file = event.target.files[0];
        if(file){
            preview.src = URL.createObjectURL(file);
            preview.style.display = "block";
        } else {
            preview.style.display = "none";
        }
    });

    function sendMessage(){
        if(!imageInput.files[0]) return;

        const file = imageInput.files[0];
        const formData = new FormData();
        formData.append("image", file);

        // Tin nhắn user
        const fileURL = URL.createObjectURL(file);
        const userDiv = document.createElement("div");
        userDiv.classList.add("d-flex", "justify-content-end", "mb-2");
        userDiv.innerHTML = `<div class="p-2 bg-primary text-white rounded" style="max-width:70%;">
                                Ảnh sản phẩm của bạn<br>
                                <img src="${fileURL}" class="img-fluid mt-1" style="max-height:150px;">
                             </div>`;
        chatBox.appendChild(userDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        // AJAX POST
        fetch("{% url 'chat_support' %}", {
            method: "POST",
            body: formData,
            headers: {
                "X-CSRFToken": "{{ csrf_token }}"
            }
        })
            .then(res => res.json())
            .then(data => {
                const botDiv = document.createElement("div");
                botDiv.classList.add("d-flex", "justify-content-start", "mb-2");
                botDiv.innerHTML = `<div class="p-2 bg-light rounded" style="max-width:70%;">
                            🤖 ${data.reply}
                        </div>`;
                chatBox.appendChild(botDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            })
            .catch(err => console.error(err));

        // Reset input & preview
        imageInput.value = "";
        preview.style.display = "none";
    }
</script>

{% endblock %}
