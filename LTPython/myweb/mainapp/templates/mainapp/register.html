{% extends "mainapp/base.html" %}
{% load static %}

{% block content %}
    <section class="vh-100" style="background-color: #eee;">
        <div class="container h-100">
            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col-lg-12 col-xl-11">
                    <div class="card text-black" style="border-radius: 25px;">
                        <div class="card-body p-md-5">
                            <div class="row justify-content-center">

                                <!-- LEFT -->
                                <div class="col-md-10 col-lg-6 col-xl-5 order-2 order-lg-1">

                                    <p class="text-center h2 fw-bold mb-5 mx-1 mx-md-4 mt-4">
                                        Đăng ký tài khoản
                                    </p>

                                    <p class="text-center fw-bold mb-5 mx-1 mx-md-4 mt-4">
                                        Bạn đã có tài khoản ?
                                        <a href="{% url 'login' %}">Đăng nhập tại đây</a>
                                    </p>

                                    {% if error %}
                                        <p class="text-danger text-center fw-bold">{{ error }}</p>
                                    {% endif %}

                                    <form class="mx-1 mx-md-4" method="POST">
                                        {% csrf_token %}

                                        <div class="d-flex flex-row align-items-center mb-4">
                                            <i class="fas fa-user fa-lg me-3 fa-fw"></i>
                                            <div class="form-outline flex-fill mb-0">
                                                <label class="form-label" for="username">Tên người dùng:</label><br>
                                                <input type="text" id="username" name="username"
                                                       class="form-control" required>
                                            </div>
                                        </div>

                                        <div class="d-flex flex-row align-items-center mb-4">
                                            <i class="fas fa-envelope fa-lg me-3 fa-fw"></i>
                                            <div class="form-outline flex-fill mb-0">
                                                <label class="form-label" for="email">Email của bạn:</label><br>
                                                <input type="email" id="email" name="email"
                                                       class="form-control" required>
                                            </div>
                                        </div>

                                        <div class="d-flex flex-row align-items-center mb-4">
                                            <i class="fas fa-map-marker-alt fa-lg me-3 fa-fw"></i>
                                            <div class="form-outline flex-fill mb-0">
                                                <label class="form-label" for="address">Địa chỉ:</label><br>
                                                <input type="text" id="address" name="address"
                                                       class="form-control" required>
                                            </div>
                                        </div>

                                        <div class="d-flex flex-row align-items-center mb-4">
                                            <i class="fas fa-key fa-lg me-3 fa-fw"></i>
                                            <div class="form-outline flex-fill mb-0">
                                                <label class="form-label" for="phone">Số điện thoại:</label><br>
                                                <input type="text" id="phone" name="phone"
                                                       class="form-control" required>
                                            </div>
                                        </div>

                                        <div class="d-flex flex-row align-items-center mb-4">
                                            <i class="fas fa-lock fa-lg me-3 fa-fw"></i>
                                            <div class="form-outline flex-fill mb-0">
                                                <label class="form-label" for="password">Mật khẩu:</label><br>
                                                <input type="password" id="password" name="password"
                                                       class="form-control" required>
                                            </div>
                                        </div>

                                        <div class="d-flex flex-row align-items-center mb-4">
                                            <i class="fas fa-key fa-lg me-3 fa-fw"></i>
                                            <div class="form-outline flex-fill mb-0">
                                                <label class="form-label" for="confirm_password">Nhập lại mật khẩu:</label><br>
                                                <input type="password" id="confirm_password"
                                                       name="confirm_password" class="form-control" required>
                                            </div>
                                        </div>

                                        <!-- Hidden role giống JSP -->
                                        <input type="hidden" name="role" value="1">

                                        <div class="d-flex justify-content-center mx-4 mb-3 mb-lg-4">
                                            <button type="submit" class="btn btn-success btn-lg">Đăng ký</button>
                                        </div>
                                    </form>

                                </div>

                                <!-- RIGHT -->
                                <div class="col-md-10 col-lg-6 col-xl-7 d-flex align-items-center order-1 order-lg-2">
                                    <img src="{% static 'images/mixicity.png' %}"
                                         class="img-fluid" alt="Sample image">
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
{% endblock %}
