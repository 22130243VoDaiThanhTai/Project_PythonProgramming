{% extends "mainapp/base.html" %}
{% load static %}

{% block content %}
<section class="vh-100" style="background-color: #eee;">
    <div class="container h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col-lg-12 col-xl-11">
                <div class="card text-black" style="border-radius: 25px;">
                    <div class="card-body p-md-5">
                        <div class="row justify-content-center">

                            <!-- LEFT -->
                            <div class="col-md-10 col-lg-6 col-xl-5 order-2 order-lg-1">

                                <p class="text-center h2 fw-bold mb-4 mt-4">
                                    Đăng ký tài khoản
                                </p>

                                <p class="text-center fw-bold mb-4">
                                    Bạn đã có tài khoản ?
                                    <a href="{% url 'login' %}">Đăng nhập tại đây</a>
                                </p>

                                {% if error %}
                                <p class="text-danger text-center fw-bold">
                                    {{ error }}
                                </p>
                                {% endif %}

                                <form class="mx-1 mx-md-4" method="POST">
                                    {% csrf_token %}

                                    <!-- USERNAME -->
                                    <div class="d-flex flex-row align-items-center mb-3">
                                        <i class="fas fa-user fa-lg me-3 fa-fw"></i>
                                        <div class="flex-fill">
                                            <label for="username">Tên người dùng</label>
                                            <input type="text"
                                                   name="username"
                                                   id="username"
                                                   class="form-control"
                                                   required>
                                        </div>
                                    </div>

                                    <!-- EMAIL -->
                                    <div class="d-flex flex-row align-items-center mb-3">
                                        <i class="fas fa-envelope fa-lg me-3 fa-fw"></i>
                                        <div class="flex-fill">
                                            <label for="email">Email</label>
                                            <input type="email"
                                                   name="email"
                                                   id="email"
                                                   class="form-control"
                                                   required>
                                        </div>
                                    </div>

                                    <!-- ADDRESS -->
                                    <div class="d-flex flex-row align-items-center mb-3">
                                        <i class="fas fa-map-marker-alt fa-lg me-3 fa-fw"></i>
                                        <div class="flex-fill">
                                            <label for="address">Địa chỉ</label>
                                            <input type="text"
                                                   name="address"
                                                   id="address"
                                                   class="form-control">
                                        </div>
                                    </div>

                                    <!-- PHONE -->
                                    <div class="d-flex flex-row align-items-center mb-3">
                                        <i class="fas fa-phone fa-lg me-3 fa-fw"></i>
                                        <div class="flex-fill">
                                            <label for="phone">Số điện thoại</label>
                                            <input type="text"
                                                   name="phone"
                                                   id="phone"
                                                   class="form-control">
                                        </div>
                                    </div>

                                    <!-- PASSWORD -->
                                    <div class="d-flex flex-row align-items-center mb-3">
                                        <i class="fas fa-lock fa-lg me-3 fa-fw"></i>
                                        <div class="flex-fill">
                                            <label for="password">Mật khẩu</label>
                                            <input type="password"
                                                   name="password"
                                                   id="password"
                                                   class="form-control"
                                                   required>
                                        </div>
                                    </div>

                                    <!-- CONFIRM PASSWORD -->
                                    <div class="d-flex flex-row align-items-center mb-4">
                                        <i class="fas fa-key fa-lg me-3 fa-fw"></i>
                                        <div class="flex-fill">
                                            <label for="confirm_password">Nhập lại mật khẩu</label>
                                            <input type="password"
                                                   name="confirm_password"
                                                   id="confirm_password"
                                                   class="form-control"
                                                   required>
                                        </div>
                                    </div>

                                    <div class="d-flex justify-content-center mb-3">
                                        <button type="submit"
                                                class="btn btn-success btn-lg"
                                                style="border-radius: 12px;">
                                            Đăng ký
                                        </button>
                                    </div>
                                </form>

                            </div>

                            <!-- RIGHT -->
                            <div class="col-md-10 col-lg-6 col-xl-7 d-flex align-items-center order-1 order-lg-2">
                                <img src="{% static 'images/mixicity.png' %}"
                                     class="img-fluid"
                                     alt="MixiCity">
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
