{% extends "mainapp/base.html" %}
{% load static %}

{% block content %}
<section class="vh-100" style="background-color: #eee;">
    <div class="container h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col-lg-12 col-xl-11">
                <div class="card text-black" style="border-radius: 25px; box-shadow: 0 8px 32px rgba(0,0,0,0.1);">
                    <div class="card-body p-md-5">
                        <div class="row justify-content-center">
                            <div class="col-md-10 col-lg-6 col-xl-5 order-2 order-lg-1">

                                <div class="text-center mb-4">
                                    <i class="fa-solid fa-user-shield fa-4x text-info mb-3"></i>
                                    <p class="h2 fw-bold mb-3">Admin Portal</p>
                                    <p class="text-muted">Đăng nhập vào trang quản trị</p>
                                </div>

                                {% if error %}
                                <div class="alert alert-danger text-center" role="alert">
                                    <i class="fa-solid fa-exclamation-triangle"></i> {{ error }}
                                </div>
                                {% endif %}

                                <form class="mx-1 mx-md-4" method="POST">
                                    {% csrf_token %}
                                    <div class="d-flex flex-row align-items-center mb-4">
                                        <i class="fas fa-user fa-lg me-3 fa-fw text-info"></i>
                                        <div class="form-outline flex-fill mb-0">
                                            <label class="form-label" for="username">Tên đăng nhập:</label>
                                            <input type="text" name="username" id="username" class="form-control"
                                                required autofocus />
                                        </div>
                                    </div>

                                    <div class="d-flex flex-row align-items-center mb-4">
                                        <i class="fas fa-lock fa-lg me-3 fa-fw text-info"></i>
                                        <div class="form-outline flex-fill mb-0">
                                            <label class="form-label" for="password">Mật khẩu:</label>
                                            <input type="password" name="password" id="password" class="form-control"
                                                required />
                                        </div>
                                    </div>

                                    <div class="d-flex justify-content-center mx-4 mb-3 mb-lg-4">
                                        <button style="border-radius: 12px; min-width: 200px;" type="submit"
                                            class="btn btn-info btn-lg">
                                            <i class="fa-solid fa-right-to-bracket"></i> Đăng nhập
                                        </button>
                                    </div>

                                    <div class="text-center text-muted">
                                        <small>
                                            <i class="fa-solid fa-shield-halved"></i>
                                            Chỉ dành cho quản trị viên
                                        </small>
                                    </div>
                                </form>

                            </div>
                            <div class="col-md-10 col-lg-6 col-xl-7 d-flex align-items-center order-1 order-lg-2">
                                <img src="{% static 'images/mixicity.png' %}" class="img-fluid" alt="MixiShop Admin">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
